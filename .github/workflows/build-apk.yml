name: Build KING VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  NODE_OPTIONS: '--max-old-space-size=4096'
  EXPO_PUBLIC_PANEL_REPO: ${{ github.repository }}

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Locate the app source
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            rm -rf _src && mkdir -p _src && unzip -q -o "$ZIP" -d _src
            DIR=$(find _src -maxdepth 2 -name package.json -not -path '*/node_modules/*' -printf '%h\n' | sort | head -n 1)
          else
            F=$(find . -maxdepth 4 -name ci-build-apk.sh -path '*/scripts/*' -not -path '*/node_modules/*' | head -n 1 || true)
            DIR=""
            if [ -n "$F" ]; then DIR=$(dirname "$(dirname "$F")"); fi
          fi
          if [ -z "$DIR" ] || [ ! -f "$DIR/scripts/ci-build-apk.sh" ]; then
            echo "::error::پروژه‌ی کامل پیدا نشد (پوشه‌ی scripts و فایل ci-build-apk.sh لازم است). فایل king-vpn-fixed.zip را بدون باز کردن در ریشه‌ی ریپو آپلود کن."
            exit 1
          fi
          echo "APP_DIR=$PWD/$DIR" >> "$GITHUB_ENV"
          echo "App dir: $PWD/$DIR"

      - name: Publish panel branch
        run: |
          SRC=""
          for d in "$APP_DIR/server" "$PWD/server" "$PWD/_src"/*/server; do
            if [ -f "$d/server.js" ]; then SRC="$d"; break; fi
          done
          if [ -z "$SRC" ]; then
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP" ]; then
              rm -rf /tmp/z && mkdir -p /tmp/z && unzip -q -o "$ZIP" -d /tmp/z
              F=$(find /tmp/z -maxdepth 4 -name server.js -not -path '*/node_modules/*' | head -n 1 || true)
              if [ -n "$F" ]; then SRC=$(dirname "$F"); fi
            fi
          fi
          if [ -z "$SRC" ]; then
            echo "::warning::پوشه‌ی server (پنل) پیدا نشد؛ شاخه‌ی panel ساخته نمی‌شود. زیپ کامل اپ را آپلود کن."
            exit 0
          fi
          echo "Panel source: $SRC"
          rm -rf /tmp/panel && mkdir -p /tmp/panel
          cp -r "$SRC/." /tmp/panel/
          cd /tmp/panel
          git init -q -b panel
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Panel for Railway"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" panel

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync package-lock.json
        run: |
          cd "$APP_DIR"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Build the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$APP_DIR"
          chmod +x scripts/ci-build-apk.sh
          bash scripts/ci-build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: king-vpn-apk
          path: output/king-vpn.apk
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-build-log
          path: output/gradle-build.log
          if-no-files-found: ignore
