name: Build KING VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Locate the app source
        run: |
          set -e
          if [ -f package.json ]; then
            echo "APP_DIR=$PWD" >> "$GITHUB_ENV"; exit 0
          fi
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            rm -rf _src && mkdir -p _src && unzip -q -o "$ZIP" -d _src
            DIR=$(find _src -maxdepth 2 -name package.json -not -path '*/node_modules/*' -printf '%h\n' | sort | head -n 1)
          else
            DIR=$(find . -maxdepth 2 -name package.json -not -path '*/node_modules/*' -printf '%h\n' | sort | head -n 1)
          fi
          if [ -z "$DIR" ]; then
            echo "::error::هیچ package.json پیدا نشد. فایل‌های پروژه را در ریشه‌ی ریپازیتوری آپلود کنید."
            exit 1
          fi
          echo "APP_DIR=$PWD/$DIR" >> "$GITHUB_ENV"
          echo "App dir: $PWD/$DIR"
          ls "$DIR/scripts"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$APP_DIR"
          chmod +x scripts/ci-build-apk.sh
          bash scripts/ci-build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: king-vpn-apk
          path: output/king-vpn.apk
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-build-log
          path: output/gradle-build.log
          if-no-files-found: ignore
